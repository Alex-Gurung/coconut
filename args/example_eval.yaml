# Example eval config (copy to args/my_eval.yaml and edit)
project: coconut
save_path: /mnt/disk/coconut/checkpoints
name: example-eval

# Eval mode
only_eval: true

# Distributed/runtime
use_ddp: true
torch_compile: false
bf16: true

# Model + checkpoint to evaluate
model_id: Qwen/Qwen3-4B-Instruct-2507
load_model_path: /mnt/disk/coconut/checkpoints/example-train/checkpoint_14
resume: 14               # keep aligned with checkpoint epoch for stage schedule
latent_init_token: "<<"

# Coconut behavior (must match training run)
coconut: true
cot: false
no_thoughts: false
no_cot: false
c_thought: 1
max_latent_stage: 10
epochs_per_stage: 2
pad_latent_to_max: true
uniform_prob: 0.0

# Data
train_path: ff_data/train.json
val_path: ff_data/val.json
use_chat_template: true

# Eval behavior
enable_gen_eval: true    # true = run slow generation eval
use_boxed_answer: true
max_new_tokens: 1024

# Sampling for stochastic eval (optional)
eval_do_sample: true
eval_temperature: 0.7
eval_top_p: 0.8
eval_top_k: null

# Unused in only_eval path, but retained for compatibility with runner
seed: 42
batch_size_training: 1
gradient_accumulation_steps: 64
num_epochs: 14
lr: !!float "5e-5"
weight_decay: 0.01
reset_optimizer: true
save_only_improve: false
save_every: 1

# Debug/smoke
debug: false
smoke_single_gpu: false
train_fraction: null
