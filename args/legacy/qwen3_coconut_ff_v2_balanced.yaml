# Coconut training - ff v2 balanced (Qwen3 4B, max_latent_stage=10)
# Updated: grad_accum 16->4 (fixes optimizer step starvation on 252 samples),
#          num_epochs 21->33 (ensures pure-latent training past stage 10).
project: coconut
save_path: /mnt/disk/coconut/checkpoints
name: qwen3-coconut-ff-v2-balanced

only_eval: False
use_ddp: True
torch_compile: False

coconut: True
cot: False
no_thoughts: False
no_cot: False
use_chat_template: True
use_boxed_answer: True

# Coconut curriculum settings
# TODO: update c_thought and max_latent_stage from sweep results
c_thought: 1
epochs_per_stage: 2
max_latent_stage: 10
pad_latent_to_max: True

save_only_improve: False
save_every: 2
uniform_prob: 0.0

model_id: Qwen/Qwen3-4B-Instruct-2507
load_model_path: None
seed: 42
resume: 0
bf16: True

train_path: ff_data/qwen_balanced_train.json
val_path: ff_data/qwen_val.json

reset_optimizer: True
batch_size_training: 1
debug: False
# grad_accum=4 gives ~16 optimizer steps/epoch (was 16 -> only ~4 steps/epoch)
gradient_accumulation_steps: 4
# 33 epochs ensures pure-latent training (stage > max_latent_stage) for epochs 22-32
num_epochs: 33
lr: !!float "5e-5"
weight_decay: 0.01
