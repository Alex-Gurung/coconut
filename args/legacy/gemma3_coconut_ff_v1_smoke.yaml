# Coconut training - ff v1 smoke (Gemma 3 4B)
project: coconut
save_path: /mnt/disk/coconut/checkpoints
name: gemma3-coconut-ff-v1-smoke

only_eval: False
use_ddp: True
torch_compile: False

coconut: True
cot: False
no_thoughts: False
no_cot: False
use_chat_template: True
use_boxed_answer: True

# Coconut curriculum settings
c_thought: 1
epochs_per_stage: 2
max_latent_stage: 10
pad_latent_to_max: True

save_only_improve: False
uniform_prob: 0.0

model_id: google/gemma-3-4b-it
load_model_path: None
seed: 42
resume: 0
bf16: True

train_path: ff_data/gemma_train.json
val_path: ff_data/gemma_val.json
train_fraction: 0.10

reset_optimizer: True
batch_size_training: 1
debug: False
gradient_accumulation_steps: 64
num_epochs: 2
lr: !!float "5e-5"
weight_decay: 0.01
