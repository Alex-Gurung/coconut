# Coconut training - following ProntoQA pattern for long reasoning chains
project: coconut
save_path: /mnt/disk/coconut/checkpoints
name: qwen-coconut-v4

only_eval: True 
enable_gen_eval: True
  # use_ddp: False
use_ddp: True 
torch_compile: False

coconut: True
cot: False
no_thoughts: False
no_cot: False
use_chat_template: True
answer_prefix: "In summary, "
# Coconut curriculum settings
# c_thought: 2  # 2 latent tokens per reasoning step
c_thought: 1  # 2 latent tokens per reasoning step
epochs_per_stage: 2  # 2 epochs at each compression level
max_latent_stage: 10  # Compress up to 5 steps (out of ~12 total)
pad_latent_to_max: True

save_only_improve: False
uniform_prob: 0.0  # Proper curriculum learning

model_id: Qwen/Qwen2.5-7B-Instruct
load_model_path: "/mnt/disk/coconut/checkpoints/qwen-coconut-v4/checkpoint_4" # Start from scratch
seed: 42
resume: 4
bf16: True

train_path: new_ncp_rl_data/train.json
  # val_path: new_ncp_rl_data/val.json
val_path: new_ncp_rl_data/test.json
# val_path: ncp_data/your_dataset_test.json

reset_optimizer: True
batch_size_training: 1  # Per GPU
debug: False
gradient_accumulation_steps: 64  # 1 * 2 GPUs * 64 = 128 effective batch
num_epochs: 14  # Stage 0-5 (12 epochs) + 2 extra at max stage
lr: !!float "5e-5"
weight_decay: 0.01

# Evaluation sampling parameters - enables stochastic generation for uncertainty estimation
eval_do_sample: True  # Enable sampling during evaluation
eval_max_new_tokens: 2048
eval_temperature: 0.7
eval_top_p: 0.8
eval_top_k: null
